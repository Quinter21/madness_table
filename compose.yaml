services:
  db:
    image: postgres:16
    container_name: madness-db
    environment:
      POSTGRES_DB: madness
      POSTGRES_USER: madness
      POSTGRES_PASSWORD: madness
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U madness']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data: